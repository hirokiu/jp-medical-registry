[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-medical-registry"
version = "0.2.0"
description = "Reproducible registry data processing"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "beautifulsoup4>=4.12,<5"]
license = {text = "MIT"}

[project.scripts]
jp-medical-registry = "jp_medical_registry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
